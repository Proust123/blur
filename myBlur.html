<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUR ON CLICK</title>

    <style>

        *{
            margin : 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main{
            height : 100vh;
            width : 100%;
            background-image: url(./images/basketball-7121617_1280.jpg);
            background-position: center;
            background-size: cover;
            filter: blur(15px);
        }

        .input{
            position: absolute;
            height : 40px;
            width : 400px;
            top : 45%;
            left : 40%;
            border: none;
            border-radius: 5px;
            font-size: 25px;
        }


    </style>

</head>
<body>
    
    <section class = "main"></section>

    <input class = "input" type = "password" placeholder = "Password">

    <!-- <script src="./myBlur.js"></script> -->
    <script src="./script.js"></script>

</body>
</html>
